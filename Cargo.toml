[workspace]
resolver = "3"
members = ["app", "daemon", "common", "ebpf"]
default-members = ["app", "daemon"]

[workspace.package]
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[workspace.dependencies]
common = { path = "common" }
ebpf = { path = "ebpf" }

anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

dirs = "7.0"
flate2 = "1.1"
maxminddb = { version = "0.32", features = ["mmap"] }

cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

aya = "0.13.1"
# aya-ebpf 0.2 breaks everything
aya-ebpf = "0.1.1"
which = "8.0"
